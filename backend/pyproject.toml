[project]
name = "strata-backend"
version = "0.1.0"
description = "Strata - autonomous manufacturing optimization agent for 3D printing (backend)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.9",
    # Official Google agent stack for GeminiAgentPlanner (app/agent/gemini_planner.py).
    # Only ever called when STRATA_PLANNER_MODE=gemini; deterministic mode
    # (the default, and all of `pytest -q`) never imports google.genai types
    # at runtime beyond this being importable.
    "google-adk>=2.0,<3.0",
    "google-genai>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises a real external binary (e.g. PrusaSlicer); auto-skipped when unavailable.",
    "gemini_smoke: makes a real, billable Gemini API call; auto-skipped when no API key is configured.",
]
